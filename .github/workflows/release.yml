name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            pkg: linux-x64-gnu
            container: rust:1-bullseye
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            pkg: linux-x64-musl
            musl: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            pkg: linux-arm64-gnu
            container: rust:1-bullseye
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            pkg: linux-arm64-musl
            musl: true
          - target: aarch64-apple-darwin
            runner: macos-15
            pkg: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            pkg: darwin-x64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p pino-loki-rs --target ${{ matrix.target }}
      - run: |
          target/${{ matrix.target }}/release/pino-loki-rs --version || true
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pino-loki-rs dist/
          tar -C dist -czf pino-loki-rs-${{ matrix.pkg }}.tar.gz pino-loki-rs
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.pkg }}
          path: pino-loki-rs-${{ matrix.pkg }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: node scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"
      - run: |
          for dir in npm/*/; do
            pkg=$(basename "$dir")
            tar -xzf "artifacts/bin-$pkg/pino-loki-rs-$pkg.tar.gz" -C "$dir"
            chmod +x "$dir/pino-loki-rs"
          done
      - run: |
          publish_once() {
            local dir="$1"
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "{\"event\":\"publish_skipped\",\"pkg\":\"$name@$version\"}"
              return 0
            fi
            npm publish "$dir" --access public
            echo "{\"event\":\"publish_ok\",\"pkg\":\"$name@$version\"}"
          }
          for dir in npm/*/; do
            publish_once "$dir"
          done
          publish_once .
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/verify
          cd /tmp/verify
          printf '{"name":"verify","private":true,"type":"module"}\n' > package.json
          for i in 1 2 3 4 5 6 7 8; do
            pnpm add "pino-loki-rs@$VERSION" && break
            echo "{\"event\":\"registry_retry\",\"attempt\":$i}"
            sleep 15
          done
          OUT=$(pnpm exec pino-loki-rs --version)
          echo "{\"event\":\"bin_version\",\"out\":\"$OUT\"}"
          [ "$OUT" = "pino-loki-rs $VERSION" ]
          node --input-type=module -e "import('pino-loki-rs/transport').then(() => console.log('transport import ok'))"
